<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="02-unit.css">
</head>
<body>
    <h2>px vs %</h2>
    <div class="parent-wide">
        <div class="bar px">200px</div>
        <div class="bar percent">50%(250px)</div>
    </div>
    <div class="parent-narrow">
        <div class="bar px">200px</div>
        <div class="bar percent">50%(150px)</div>
    </div>
    <div class="parent-narrow">
        <div class="bar px">200px</div>
        <div class="bar percent">50%(250px)</div>
    </div>
</body>
</html>
